name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bridge + synthesis tests (848)
        run: |
          python -m pytest battery_bridge/tests/ polymer_bridge/tests/ metal_bridge/tests/ ceramic_bridge/tests/ semiconductor_bridge/tests/ glass_bridge/tests/ cross_bridge/tests/ synthesis_planner/tests/ -q

      - name: Run molecular bridge tests (90)
        run: python -m pytest molecular_bridge/tests/ -q

      - name: Run PFAS compliance tests (81)
        run: python -m pytest pfas_bridge/tests/ -q

      - name: Run composition engine tests (164)
        run: python -m pytest composition_engine/tests/ -q

      - name: Run API tests (37)
        run: python -m pytest api/tests/test_api.py -v

      - name: Run ZFC + enhanced math tests (110)
        run: |
          python -m pytest tests/test_material_zfc.py tests/test_enriched_category.py tests/test_dempster_shafer.py tests/test_streaming_kan.py -q

      - name: Run PFAS PDF + access control tests (22)
        run: python -m pytest tests/test_pfas_pdf.py tests/test_pfas_report.py tests/test_access_control.py -q

      - name: Run dogfood validation (38 questions)
        run: python showcase/dogfood_test.py
